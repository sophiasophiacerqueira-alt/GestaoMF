<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Michelle Farias Plano B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-cal" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="15.5" rx="3" />
        <path d="M3.5 10h17M8 3v4M16 3v4" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <circle cx="9" cy="8.5" r="3.5" />
        <path
          d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M15.5 5.2a3.3 3.3 0 0 1 0 6.6M17.8 14.8c2 .7 3.3 2.4 3.7 5.2"
        />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M12 21.2c-.4 0-.8-.2-1.1-.4C7.3 18.2 2 14.3 2 9.1 2 6 4.4 3.6 7.4 3.6c1.9 0 3.6 1 4.6 2.5 1-1.5 2.7-2.5 4.6-2.5 3 0 5.4 2.4 5.4 5.5 0 5.2-5.3 9.1-8.9 11.7-.3.2-.7.4-1.1.4z"
        />
      </symbol>
      <symbol id="i-gem" viewBox="0 0 24 24">
        <path d="M7 4h10l4 5.5L12 20 3 9.5z" />
        <path d="M3 9.5h18M9.5 4 8 9.5l4 10.5 4-10.5L14.5 4" fill="none" />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24">
        <path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z" />
        <path d="M3.5 7.5 12 12l8.5-4.5M12 12v9" />
      </symbol>
      <symbol id="i-cash" viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="13" rx="3" />
        <path d="M3 10.5h18" />
        <circle cx="16.5" cy="14.8" r="1.2" />
      </symbol>
      <symbol id="i-set" viewBox="0 0 24 24">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
        <circle cx="15" cy="7" r="2.2" />
        <circle cx="9" cy="17" r="2.2" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M4.5 19.5 5.6 16A7.8 7.8 0 1 1 8.4 18.6z" />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24">
        <path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.4" />
      </symbol>
      <symbol id="i-spot" viewBox="0 0 24 24">
        <path
          d="M12.6 4.4c4-.2 7.4 2.6 7.5 6.4.1 3.9-2.7 7.6-6.8 8.3-4.2.7-8.1-1.8-8.6-5.7-.5-4 3.6-8.8 7.9-9z"
          style="
            fill: var(--sf, none);
            stroke: var(--sb, currentColor);
            stroke-width: var(--sw, 1.4);
            stroke-dasharray: var(--sd, none);
          "
        />
        <path
          d="M5.1 9.6c-1.5 2.7-1.1 6.1 1.2 8.1 2.3 2 5.7 2.4 8.6 1.2"
          style="fill: none; stroke: var(--so, none); stroke-width: 1.9; stroke-linecap: round"
        />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m20 20-4.2-4.2" />
      </symbol>
    </svg>
    <header class="top">
      <a class="brand" href="#hoje"
        ><span id="bMono"></span
        ><span class="bt"
          ><b id="bNome">Michelle Farias</b><span id="bSub">Piercing · gestão</span></span
        ></a
      >
      <div class="acts">
        <button type="button" class="btn pri hide-m w" data-act="novoAt">
          <svg class="i" aria-hidden="true"><use href="#i-plus" /></svg>Novo atendimento</button
        ><a class="ico" id="aj" href="#ajustes" aria-label="Ajustes"
          ><svg class="i" aria-hidden="true"><use href="#i-set" /></svg
        ></a>
      </div>
      <nav class="tabs" aria-label="Seções">
        <a href="#hoje" data-tab="hoje"
          ><span class="tic"
            ><svg class="i" aria-hidden="true"><use href="#i-cal" /></svg></span
          ><span>Hoje</span></a
        >
        <a href="#clientes" data-tab="clientes"
          ><span class="tic"
            ><svg class="i" aria-hidden="true"><use href="#i-users" /></svg></span
          ><span>Clientes</span></a
        >
        <a href="#fidelidade" data-tab="fidelidade"
          ><span class="tic"
            ><svg class="i" aria-hidden="true"><use href="#i-heart" /></svg></span
          ><span>Fidelidade</span></a
        >
        <a href="#materiais" data-tab="materiais"
          ><span class="tic"
            ><svg class="i" aria-hidden="true"><use href="#i-box" /></svg></span
          ><span>Materiais</span></a
        >
        <a href="#caixa" data-tab="caixa"
          ><span class="tic"
            ><svg class="i" aria-hidden="true"><use href="#i-cash" /></svg></span
          ><span>Caixa</span></a
        >
      </nav>
    </header>
    <p id="note" class="note" role="status" hidden></p>
    <main id="main"></main>
    <button type="button" class="fab w" data-act="novoAt">
      <svg class="i" aria-hidden="true"><use href="#i-plus" /></svg>Atender
    </button>
    <div id="sheet" class="ov" hidden>
      <div class="sh" role="dialog" aria-modal="true" aria-label="Detalhes">
        <div id="shBody"></div>
      </div>
    </div>
    <div id="ask" class="ov ask" hidden>
      <div class="askb" role="alertdialog" aria-modal="true">
        <p></p>
        <div class="row2">
          <button type="button" class="btn" data-no>Cancelar</button
          ><button type="button" class="btn pri" data-ok>Confirmar</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="js/exemplos.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
